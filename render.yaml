services:
  - type: web
    name: pickinggeek0001
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build && cd .. && python backend/manage.py collectstatic --no-input
    startCommand: python backend/manage.py migrate && (python backend/manage.py createsuperuser --noinput || true) && python -m gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --timeout 180 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://pickinggeek0001.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pickinggeek0001.onrender.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      - key: JOB_WEBHOOK_SECRET
        generateValue: true
